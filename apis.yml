aid: amazon-workspaces-web
name: Amazon WorkSpaces Web
description: Amazon WorkSpaces Web is a purpose-built, low-cost, fully managed service that enables secure browser access
  to internal websites and SaaS applications. It provides persistent browser sessions with built-in security controls, preventing
  users from downloading content to local devices while maintaining a seamless browsing experience. The service offers 58
  API operations for managing portals, user settings, browser policies, network settings, trust stores, and IP access controls.
